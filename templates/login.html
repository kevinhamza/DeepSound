<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DeepSound</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            background-size: 400% 400%;
            color: white;
        }
        .login-card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1) ;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: black;,
        }
        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 35px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 50px;
            border: none;
            outline: none;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: blue;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.6);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="title">DeepSound</h1>
        <p class="subtitle">Luxury AI Voice Assistant</p>
        <form method="POST">
            <input name="username" placeholder="Enter Username" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
